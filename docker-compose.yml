services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs_user
      POSTGRES_PASSWORD: jobs_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs_user -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://jobs_user:jobs_password@db:5432/jobs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
